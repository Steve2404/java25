name: Chapter 4 Java 25 verification

on:
  push:
    branches:
      - main
      - chapter4-exercises-rewrite
    paths:
      - "chapter-04-elementare-sprachelemente/**"
      - ".github/workflows/chapter04-java25.yml"
  pull_request:
    paths:
      - "chapter-04-elementare-sprachelemente/**"

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Show Java version
        run: |
          java --version
          javac --version

      - name: Compile support code
        working-directory: chapter-04-elementare-sprachelemente
        run: |
          mkdir -p build/support
          javac --release 25 -d build/support ExerciseChecker.java test-support/Simput.java test-support/IO.java

      - name: Compile every official solution
        working-directory: chapter-04-elementare-sprachelemente
        shell: bash
        run: |
          set -euo pipefail

          for f in solutions/*.java; do
            name="$(basename "$f" .java)"
            out="build/$name"
            mkdir -p "$out"

            if [[ "$name" == "Solution39PrimitivePreviewSwitch" ]]; then
              javac --enable-preview --release 25 -cp build/support -d "$out" "$f"
            else
              javac --release 25 -cp build/support -d "$out" "$f"
            fi
          done

      - name: Run deterministic official solutions
        working-directory: chapter-04-elementare-sprachelemente
        shell: bash
        run: |
          set -euo pipefail

          run_class () {
            local name="$1"
            java -cp "build/$name:build/support" "$name"
          }

          run_with_input () {
            local name="$1"
            local input="$2"
            printf "%b" "$input" | java -cp "build/$name:build/support" "$name"
          }

          for f in solutions/Solution*.java; do
            name="$(basename "$f" .java)"

            case "$name" in
              Solution03SwingNotification|Solution40JOptionPaneConfig|Solution41GuiParseOrCancel)
                echo "[SKIP-RUNTIME] $name (Swing UI / headless CI)"
                ;;

              Solution16VisitorCheckIn)
                run_with_input "$name" "33\n1.82\nL\n"
                ;;

              Solution17RoomArea)
                run_with_input "$name" "5.5\n2.0\n"
                ;;

              Solution18DurationConverter)
                run_with_input "$name" "3665\n"
                ;;

              Solution33PositiveInputDoWhile)
                run_with_input "$name" "-2\n0\n7\n"
                ;;

              Solution39PrimitivePreviewSwitch)
                java --enable-preview -cp "build/$name:build/support" "$name"
                ;;

              *)
                run_class "$name"
                ;;
            esac
          done
